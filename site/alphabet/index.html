<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alphabet · Calm Match</title>
<meta name="description" content="A calm alphabet book for children in English and Irish. Pictures for every letter, and your own family photos too. No tracking, works offline.">
<meta name="theme-color" content="#3f7c74">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/base.css">
<style>
  .ab-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 16px; }
  .ab-head h1 { font-size: clamp(28px, 5vw, 40px); margin-bottom: 6px; }
  .ab-head p { margin: 0; color: var(--muted); max-width: 52ch; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .seg button { min-height: 48px; padding: 0 18px; border: 0; background: transparent; font-weight: 700; color: var(--muted); }
  .seg button + button { border-left: 2px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* letter picker: every letter, always in the same place */
  .ab-letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
  .ab-letters button { width: 100%; min-height: 52px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface);
    font: 600 22px/1 var(--display); color: var(--ink); }
  .ab-letters button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

  /* one letter at a time */
  .ab-page { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .ab-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 16px; }
  .ab-nav { min-width: 56px; min-height: 56px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
    font: 600 16px/1.1 var(--display); color: var(--ink); padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; }
  .ab-nav[disabled] { opacity: .35; cursor: default; }
  .ab-big { text-align: center; font: 600 clamp(64px, 16vw, 120px)/1 var(--display); color: var(--ink); margin: 0; letter-spacing: .02em; }
  .ab-big .lo { color: var(--accent); }
  .ab-words { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .ab-card { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px 12px;
    border: 2px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); }
  .ab-card:hover { border-color: var(--accent); }
  .ab-card.said { border-color: var(--accent); background: var(--accent-soft); }
  .ab-pic { width: 120px; height: 120px; display: grid; place-items: center; font-size: 84px; line-height: 1; }
  .ab-pic img { width: 120px; height: 120px; object-fit: cover; border-radius: 14px; display: block; }
  .ab-word { font: 600 22px/1.2 var(--display); overflow-wrap: anywhere; text-align: center; }
  .ab-word .lt { color: var(--accent); font-weight: 700; }
  .ab-tag { font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--hint-soft); }
  .ab-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .ab-voice { min-height: 48px; padding: 0 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; color: var(--ink); }
  .ab-voice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ab-note { color: var(--muted); font-size: 15px; margin: 0; max-width: 60ch; }
  @media (max-width: 420px) {
    .ab-words { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ab-pic, .ab-pic img { width: 88px; height: 88px; font-size: 64px; }
    .ab-word { font-size: 19px; }
    .ab-nav .txt { display: none; }
  }
  body[data-big="on"] .ab-letters { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
  body[data-big="on"] .ab-letters button { min-height: 64px; font-size: 26px; }
  body[data-big="on"] .ab-nav { min-height: 68px; min-width: 68px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-head">
  <a class="brand" href="../index.html"><i></i>Calm Match</a>
  <nav class="site-nav" aria-label="Main">
    <a href="../index.html">About</a><a href="../singalong/">Sing along</a><a href="./" aria-current="page">Alphabet</a><a href="../account.html" data-accounts-on hidden>Account</a><a href="../support.html">Support</a><a class="cta" href="../play.html">Play</a>
  </nav>
</header>

<main id="main" class="page">
  <div class="ab-head">
    <div>
      <h1 id="h1">Alphabet</h1>
      <p id="lede">Pick a letter. Tap a picture to hear its word.</p>
    </div>
    <div class="seg" role="group" aria-label="Language / Teanga" id="langSeg">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="ga" aria-pressed="false">Gaeilge</button>
    </div>
  </div>

  <nav aria-label="Letters" id="lettersNav"><ul class="ab-letters" id="letters"></ul></nav>

  <section class="ab-page" aria-labelledby="big">
    <div class="ab-top">
      <button type="button" class="ab-nav" id="prev"><span aria-hidden="true">◀</span> <span class="txt" id="prevTxt"></span></button>
      <h2 class="ab-big" id="big" aria-live="polite"></h2>
      <button type="button" class="ab-nav" id="next"><span class="txt" id="nextTxt"></span> <span aria-hidden="true">▶</span></button>
    </div>
    <ul class="ab-words" id="words"></ul>
    <div class="ab-bar">
      <button type="button" class="ab-voice" id="voice" aria-pressed="true"></button>
      <p class="ab-note" id="voiceNote" hidden></p>
    </div>
  </section>

  <p class="ab-note" id="grownNote" style="margin-top:16px"></p>
</main>

<footer class="site-foot">
  <span>© <span id="year">2026</span> J.P Cunningham</span>

</footer>
<script src="../js/alphabet.js"></script>
<script src="../js/media.js"></script>
<script src="../js/library.js"></script>
<script src="book.js"></script>
</body>
</html>
