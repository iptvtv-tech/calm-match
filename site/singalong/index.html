<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sing along · Calm Match</title>
<meta name="description" content="Sing-along songs for children in English and Irish. The words light up as a gentle tune plays. No microphone, no tracking, works offline.">
<meta name="theme-color" content="#3f7c74">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/base.css">
<style>
  .sa-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 20px; }
  .sa-head h1 { font-size: clamp(28px, 5vw, 40px); margin-bottom: 6px; }
  .sa-head p { margin: 0; color: var(--muted); max-width: 52ch; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .seg button { min-height: 48px; padding: 0 18px; border: 0; background: transparent; font-weight: 700; color: var(--muted); }
  .seg button + button { border-left: 2px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .grid { list-style: none; margin: 0 0 32px; padding: 0; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  @media (max-width: 420px) { .grid { gap: 12px; } .card .name { font-size: 16px; } .card .meta { padding: 10px 12px 12px; } }
  .card { display: flex; flex-direction: column; height: 100%; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
  .card:hover { border-color: var(--accent); }
  .card img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; background: var(--dim); }
  .card .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .name { font: 600 18px/1.25 var(--display); }
  .card .tag { align-self: flex-start; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--ink); }
  .card .tag.lively { background: var(--hint-soft); }
  .empty { color: var(--muted); }
  body[data-big="on"] .seg button { min-height: 60px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-head">
  <a class="brand" href="../index.html"><i></i>Calm Match</a>
  <nav class="site-nav" aria-label="Main">
    <a href="../index.html">About</a><a href="./" aria-current="page">Sing along</a><a href="../account.html" data-accounts-on hidden>Account</a><a href="../support.html">Support</a><a class="cta" href="../play.html">Play</a>
  </nav>
</header>

<main id="main" class="page">
  <div class="sa-head">
    <div>
      <h1 id="h1">Sing along</h1>
      <p id="lede">Pick a song. The words light up as the tune plays, so your child can sing along at their own pace.</p>
    </div>
    <div class="seg" role="group" aria-label="Language / Teanga" id="langSeg">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="ga" aria-pressed="false">Gaeilge</button>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="group" id="filterSeg" aria-label="Songs">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="calm" aria-pressed="false">Calm</button>
      <button type="button" data-f="lively" aria-pressed="false">Lively</button>
    </div>
  </div>

  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden></p>
</main>

<footer class="site-foot">
  <span>© <span id="year">2026</span> <span data-cfg="ownerName">J.P Cunningham</span></span>
  <nav aria-label="Legal"><a href="../privacy.html">Privacy</a><a href="../privacy-kids.html">Privacy for children</a><a href="../cookies.html">Cookies</a><a href="../terms.html">Terms</a><a href="../accessibility.html">Accessibility</a><a href="../support.html">Support the site</a><a href="../credits.html">Credits</a></nav>
</footer>
<script src="songs.js"></script>
<script src="shared.js"></script>
<script src="picker.js"></script>
</body>
</html>
