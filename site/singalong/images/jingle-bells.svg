  <path d="M196 86 q-24 40 -40 50 M204 86 q24 40 40 50" fill="none" stroke="#d9534f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="84" r="10" fill="#b93f3b"/>
  <!-- bells -->
  <g>
    <circle cx="150" cy="176" r="46" fill="#f2c14e"/>
    <circle cx="136" cy="160" r="14" fill="#fbe29a" opacity=".8"/>
    <path d="M110 180 q40 18 80 0" fill="none" stroke="#d9a43a" stroke-width="5"/>
    <circle cx="150" cy="196" r="7" fill="#7a5638"/><path d="M150 202 v10" stroke="#7a5638" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="128" r="9" fill="none" stroke="#d9a43a" stroke-width="5"/>
