    <g id="flake" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 -9 V9 M-8 -4.5 L8 4.5 M-8 4.5 L8 -4.5"/>
    </g>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <path d="M0 236 Q 120 214 240 230 T 400 224 V300 H0 Z" fill="#eef4f9"/>
  <path d="M0 262 Q 150 248 280 262 T 400 258 V300 H0 Z" fill="#ffffff"/>
