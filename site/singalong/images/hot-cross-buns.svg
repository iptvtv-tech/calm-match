<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Three warm buns with crosses on a blue plate</title>
  <rect width="400" height="300" fill="#f5ead9"/>
  <rect y="190" width="400" height="110" fill="#d9b48c"/>
  <g stroke="#c9a17a" stroke-width="3"><path d="M0 222 h400"/><path d="M0 258 h400"/></g>
