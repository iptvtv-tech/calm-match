  <path d="M318 30 v96 M270 78 h96" stroke="#e8d6bd" stroke-width="6"/>
  <!-- plate -->
  <ellipse cx="190" cy="226" rx="140" ry="34" fill="#4f7fb6"/>
  <ellipse cx="190" cy="220" rx="122" ry="26" fill="#6e9bcd"/>
  <ellipse cx="190" cy="220" rx="100" ry="19" fill="#86b0dc"/>
  <!-- buns -->
  <g>
    <ellipse cx="120" cy="196" rx="44" ry="30" fill="#c98742"/>
    <ellipse cx="114" cy="186" rx="26" ry="12" fill="#dda15a" opacity=".7"/>
    <path d="M90 194 q30 -10 60 0 M120 168 q4 26 0 54" stroke="#fbf1de" stroke-width="7" stroke-linecap="round" fill="none"/>
    <ellipse cx="260" cy="196" rx="44" ry="30" fill="#c98742"/>
    <ellipse cx="254" cy="186" rx="26" ry="12" fill="#dda15a" opacity=".7"/>
    <path d="M230 194 q30 -10 60 0 M260 168 q4 26 0 54" stroke="#fbf1de" stroke-width="7" stroke-linecap="round" fill="none"/>
    <ellipse cx="190" cy="170" rx="46" ry="32" fill="#cf8d47"/>
    <ellipse cx="184" cy="158" rx="28" ry="13" fill="#e2a862" opacity=".7"/>
    <path d="M158 168 q32 -10 64 0 M190 140 q4 28 0 58" stroke="#fbf1de" stroke-width="7" stroke-linecap="round" fill="none"/>
